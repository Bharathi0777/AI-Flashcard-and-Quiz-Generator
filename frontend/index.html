<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Self-Learning</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
body { background:#f0f2f5; padding-bottom:40px; }
header { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; padding:28px 20px; text-align:center; }
header h1 { font-size:28px; }
header p { opacity:.85; margin-top:5px; font-size:13px; }
.search-bar { max-width:650px; margin:-18px auto 20px; background:#fff; padding:14px; border-radius:14px; display:flex; gap:10px; box-shadow:0 6px 20px rgba(0,0,0,.1); }
.search-bar input { flex:1; padding:12px; border:1.5px solid #ddd; border-radius:10px; font-size:15px; outline:none; }
.search-bar button { padding:12px 22px; background:#4f46e5; color:#fff; border:none; border-radius:10px; font-weight:600; cursor:pointer; }
.container { max-width:800px; margin:auto; padding:0 16px; }
.section-title { display:flex; align-items:center; gap:10px; margin:24px 0 12px; }
.badge { background:#e0e7ff; color:#4f46e5; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; }
.card { background:#fff; border-radius:14px; padding:18px 20px; margin-bottom:14px; box-shadow:0 2px 12px rgba(0,0,0,.06); border:1px solid #eee; }
.card b { font-size:15.5px; line-height:1.5; display:block; margin-bottom:8px; }
.card p { font-size:14.5px; line-height:1.7; color:#555; }
.options { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.options label { display:flex; align-items:center; gap:10px; background:#f8fafc; padding:11px 13px; border:1.5px solid #e5e7eb; border-radius:10px; cursor:pointer; font-size:14px; }
.options label:hover { border-color:#4f46e5; background:#eef2ff; }
.options input { accent-color:#4f46e5; width:17px; height:17px; flex-shrink:0; }
.options label.correct { border-color:#16a34a !important; background:#dcfce7 !important; color:#166534; font-weight:700; }
.options label.wrong { border-color:#dc2626 !important; background:#fee2e2 !important; color:#991b1b; }
.options label.correct-answer { border:2px solid #16a34a !important; background:#dcfce7 !important; }
.correct-msg { color:#16a34a; font-weight:700; margin-top:8px; font-size:13px; }
.wrong-msg { color:#dc2626; font-weight:700; margin-top:8px; font-size:13px; line-height:1.6; }
.submit { width:100%; padding:16px; background:#16a34a; color:#fff; border:none; border-radius:12px; font-size:17px; font-weight:700; cursor:pointer; margin-top:20px; }
#result { text-align:center; margin-top:16px; font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>📚 Smart Self-Learning</h1>
  <p>AI Powered Flashcards & Quiz</p>
</header>

<div class="search-bar">
  <input id="topic" placeholder="Enter topic: html, python, java...">
  <button onclick="generate()">Generate ✨</button>
</div>

<div class="container">
  <div class="section-title"><h2>📖 Flashcards</h2><span class="badge" id="fc">0 Cards</span></div>
  <div id="flashcards"></div>

  <div class="section-title"><h2>🧠 Quiz</h2><span class="badge" id="qc">0 Questions</span></div>
  <div id="quiz"></div>

  <button id="submitBtn" class="submit" onclick="submitQuiz()" style="display:none;">✅ Submit Quiz</button>
  <div id="result"></div>
</div>

<script>
let quizData = [];

function generate() {
  const raw = document.getElementById('topic').value.trim().toLowerCase() || 'html';
  const T = raw.toUpperCase();

  const topicInfo = {
    'html': { full:'HyperText Markup Language', use:'Web Pages', ex:'<h1>Hello</h1>' },
    'python': { full:'Python Programming Language', use:'AI & Web Development', ex:'print("Hello")' },
    'java': { full:'Java Programming Language', use:'Android Apps', ex:'System.out.println("Hello")' },
    'css': { full:'Cascading Style Sheets', use:'Website Design', ex:'color: red;' },
    'javascript': { full:'JavaScript Language', use:'Interactive Websites', ex:'alert("Hi")' },
    'sql': { full:'Structured Query Language', use:'Database', ex:'SELECT * FROM students' }
  };
  const info = topicInfo[raw] || { full: T + ' Concept', use:'Projects & Applications', ex:'Example of ' + T };

  const concepts = [
    { q:`What is ${T}?`, a:`${T} stands for ${info.full}. It is used for ${info.use} and is very important for students.` },
    { q:`Why is ${T} important?`, a:`${T} is important because without it you cannot build ${info.use}. It helps to create real projects and get jobs.` },
    { q:`What are features of ${T}?`, a:`Features: Easy to learn, Free to use, High demand, Large community support for ${T}.` },
    { q:`Where is ${T} used?`, a:`${T} is used in ${info.use}, company projects, and college VAC projects. Big companies use ${T} daily.` },
    { q:`Example of ${T}?`, a:`Simple Example: ${info.ex}. This small code shows how ${T} works.` },
    { q:`Advantages of ${T}?`, a:`Advantages: 1) Beginner friendly 2) Quick to build 3) Lots of jobs 4) Free resources.` },
    { q:`Disadvantages of ${T}?`, a:`Needs practice and extra tools for large projects. But for learning, ${T} is best.` },
    { q:`Project Idea using ${T}?`, a:`Build Student Management System using ${T}. Add Login, Display, Search - perfect VAC demo!` },
    { q:`How to learn ${T} for exams?`, a:`3 Steps: 1) Basics 2 days 2) Practice 5 examples daily 3) Build 1 mini-project.` },
    { q:`Career in ${T}?`, a:`Career: Developer, Software Engineer, Freelancer. ${T} skills have high salary in Chennai.` }
  ];

  document.getElementById('fc').innerText = '10 Cards';
  document.getElementById('qc').innerText = '10 Questions';
  document.getElementById('flashcards').innerHTML = concepts.map((c,i) => `<div class="card"><b>${i+1}. ${c.q}</b><p>${c.a}</p></div>`).join('');

  const quizQs = [
    { q:`What is ${T}?`, o:[`${info.full}`,`Cooking`,`Game`,`Song`], a:`${info.full}` },
    { q:`${T} is used for?`, o:[`${info.use}`,`Sleeping`,`Farming`,`Driving`], a:`${info.use}` },
    { q:`Example of ${T}?`, o:[`${info.ex}`,`12345`,`Hello Food`,`No Idea`], a:`${info.ex}` },
    { q:`Is ${T} easy?`, o:[`Yes, Easy`,`No, Hard`,`Only PhD`,`No`], a:`Yes, Easy` },
    { q:`Feature of ${T}?`, o:[`Beginner Friendly`,`Very Costly`,`No Jobs`,`Useless`], a:`Beginner Friendly` },
    { q:`Where is ${T} used?`, o:[`Companies & Projects`,`Forest`,`Space`,`Sea`], a:`Companies & Projects` },
    { q:`Best way to learn ${T}?`, o:[`Practice + Project`,`Only Sleep`,`No Practice`,`Theory Only`], a:`Practice + Project` },
    { q:`Career with ${T}?`, o:[`Developer`,`Driver`,`Farmer`,`Singer`], a:`Developer` },
    { q:`Is ${T} in demand?`, o:[`High Demand`,`No Demand`,`Will Go`,`Low`], a:`High Demand` },
    { q:`What to build with ${T}?`, o:[`Mini Project`,`House`,`Car`,`Bridge`], a:`Mini Project` }
  ];

  quizData = quizQs;
  document.getElementById('quiz').innerHTML = quizData.map((q,i) => `<div class="card"><b>${i+1}. ${q.q}</b><div class="options">${q.o.map(o => `<label><input type="radio" name="q${i}" value="${o}"><span>${o}</span></label>`).join('')}</div></div>`).join('');

  
  document.getElementById('submitBtn').style.display = 'block';
}

function submitQuiz() {
  let s = 0;
  quizData.forEach((q,i) => {
    const all = document.querySelectorAll(`input[name="q${i}"]`);
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    let msg = document.getElementById(`msg${i}`);
    if(!msg){ msg = document.createElement('div'); msg.id = `msg${i}`; all[0].closest('.card').appendChild(msg); }
    all.forEach(r => r.parentElement.classList.remove('correct','wrong','correct-answer'));
    if(!sel){
      msg.innerHTML = `<div class="wrong-msg">⚠️ Not Answered! Correct: ${q.a}</div>`;
      all.forEach(r => { if(r.value === q.a) r.parentElement.classList.add('correct-answer'); });
      return;
    }
    if(sel.value === q.a){
      s++; sel.parentElement.classList.add('correct');
      msg.innerHTML = `<div class="correct-msg">✅ Correct! Super!</div>`;
    } else {
      sel.parentElement.classList.add('wrong');
      all.forEach(r => { if(r.value === q.a) r.parentElement.classList.add('correct-answer'); });
      msg.innerHTML = `<div class="wrong-msg">❌ Incorrect!<br>Your Answer: ${sel.value}<br>Correct Answer: ${q.a} ✅</div>`;
    }
  });
  document.getElementById('result').innerHTML = `<h2>Score: ${s} / 10 ${s>=7?'🎉 Excellent!':'💪 Try Again!'}</h2>`;
}
</script>
</body>
</html>
